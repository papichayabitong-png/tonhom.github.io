<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- ระบบตรวจจับการแสดงผลเพื่อควบคุมเสียงพากย์ -->
  <script>
    AFRAME.registerComponent('play-sound-on-target', {
      init: function () {
        const audio = document.querySelector('#voice-sound');
        const target = this.el;
        let isShowing = false;

        // ปลดล็อกระบบเสียงของมือถืออัตโนมัติเมื่อผู้ใช้แตะจอครั้งแรก
        const unlock = () => {
          if (audio) {
            audio.play().then(() => {
              if (!isShowing) {
                audio.pause();
                audio.currentTime = 0;
              }
            }).catch(() => {});
          }
          window.removeEventListener('touchstart', unlock);
          window.removeEventListener('click', unlock);
        };
        window.addEventListener('touchstart', unlock, { once: true });
        window.addEventListener('click', unlock, { once: true });

        // เล่นเสียงพากย์ทันทีที่ส่องเจอรูปเป้าหมาย
        target.addEventListener('targetFound', () => {
          isShowing = true;
          if (audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log('Wait for interaction:', e));
          }
        });

        // หยุดเสียงทันทีที่เอากล้องหนีจากรูปเป้าหมาย
        target.addEventListener('targetLost', () => {
          isShowing = false;
          if (audio) {
            audio.pause();
          }
        });
      }
    });
  </script>
</head>

<body>
<a-scene
  mindar-image="imageTargetSrc:https://tonhom.github.io/targets.mind; maxTrack: 5;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <!-- 1. เปลี่ยนลิงก์รูปภาพที่จะให้เด้งขึ้นมา (.png หรือ .jpg) -->
    <img id="popup-image" src="https://papichayabitong-png.github.io/tonhom.github.io/855156589_964317796236502_538376340216801786_n.jpg">

    <!-- 2. ลิงก์ไฟล์เสียงพากย์ของคุณ (.mp3) -->
    <audio id="voice-sound" src="https://papichayabitong-png.github.io/tonhom.github.io/luvvoice.com-20261021-tkX9kb(1).mp3" preload="auto"></audio>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Target 1: เมื่อส่องเจอรูป จะแสดงภาพ 2D และเล่นเสียงพากย์ -->
  <a-entity mindar-image-target="targetIndex: 0" play-sound-on-target>
    <!-- ปรับขนาดความกว้าง/สูง (width, height) และตำแหน่ง (position) ได้ตามต้องการ -->
    <a-image src="#popup-image" position="0 0 0.2" width="1" height="1"></a-image>
  </a-entity>

</a-scene>
</body>
</html>
