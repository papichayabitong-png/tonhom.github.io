<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฟิลเตอร์แว่นและหมวก</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mindar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <a-scene
    mindar-face="
      faceModelSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/faceModel/faceModel.glb;
      maxTrack: 1;
    "
    xr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="glasses" src="./glasses.glb"></a-asset-item>
      <a-asset-item id="hat" src="./hat.glb"></a-asset-item>
    </a-assets>

    <!-- กล้อง -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- แว่นตา -->
    <a-entity mindar-face-target="anchorIndex: 1">
      <a-gltf-model
        src="#glasses"
        scale="0.006 0.006 0.006"
        position="0 0 0.02">
      </a-gltf-model>
    </a-entity>

    <!-- หมวกบนหัว -->
    <a-entity mindar-face-target="anchorIndex: 10">
      <a-gltf-model
        src="#hat"
        scale="0.008 0.008 0.008"
        position="0 0.08 0">
      </a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
